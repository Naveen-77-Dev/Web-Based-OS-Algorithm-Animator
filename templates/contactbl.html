<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - OS Algorithm Visualizer</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="dark-theme">
    <div class="beforelogin" >
        <nav class="navbar">
            <div class="navbar-left">
              <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="navbar-logo">
              <div class="nav-brand">OS Algorithm Visualizer</div>
            </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="contactbl.html" class="active">Contact</a>
            
        </div>
    </nav>
</div>

    <main>
        <div class="contact-container">
            <div class="contact-card">
                <h2>Contact Us</h2>
                <form class="contact-form" >
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Enter subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="4" placeholder="Enter your message" required></textarea>
                    </div><br>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <script src="contact.js"></script>

</body>
<script>
    // Remove the onsubmit attribute from your form and modify the script like this:
    document.addEventListener('DOMContentLoaded', function() {
        const contactForm = document.querySelector('.contact-form');
        if (contactForm) {
            contactForm.addEventListener('submit', handleContact);
        }
    });
    
    function handleContact(event) {
        event.preventDefault();
        
        const form = event.target;
        const formData = {
            name: form.querySelector('#name').value,
            email: form.querySelector('#email').value,
            subject: form.querySelector('#subject').value,
            message: form.querySelector('#message').value
        };
        
        const submitButton = form.querySelector('button[type="submit"]');
        const originalText = submitButton.textContent;
        
        submitButton.disabled = true;
        submitButton.textContent = 'Sending...';
        
        fetch('/submit_contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw err; });
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert(data.message);
                form.reset();
            } else {
                throw new Error(data.error || 'Submission failed');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert(error.message);
        })
        .finally(() => {
            submitButton.disabled = false;
            submitButton.textContent = originalText;
        });
    }
    </script>

</html>
